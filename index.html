<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document Verification</title>
</head>
<body>
    <h1>Document Verification</h1>
    <form id="verificationForm">
        <label for="document">Upload Document:</label>
        <input type="file" id="document" name="document" accept=".pdf,.doc,.docx,.jpg,.png" required>
        <br><br>
        <button type="submit">Verify Document</button>
    </form>

    <div id="result"></div>

    <script>
        document.getElementById('verificationForm').addEventListener('submit', function(event) {
            event.preventDefault();
            const fileInput = document.getElementById('document');
            const file = fileInput.files[0];

            if (file) {
                // Simulate document verification process
                const resultDiv = document.getElementById('result');
                resultDiv.innerHTML = `<p>Verifying document: ${file.name}</p>`;

                // Simulated verification result
                setTimeout(() => {
                    resultDiv.innerHTML += `<p>Document ${file.name} has been successfully verified.</p>`;
                }, 2000);
            } else {
                alert('Please upload a document.');
            }
        });
    </script>
</body>
</html>
